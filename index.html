<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1424">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>Budget</title>
</head>
<body>
  <main id="app"></main>

  <button class="add-btn" data-action="add">
    <span aria-hidden="true">+</span> Add expense
  </button>

  <nav class="tabbar">
    <button data-action="go" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </button>
    <button data-action="go" data-view="savings">
      <svg viewBox="0 0 24 24"><path d="M19 7h1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1l-1.5 3.5a2 2 0 0 1-1.8 1.2h-.4a2 2 0 0 1-2-2v-.7h-3v.7a2 2 0 0 1-2 2h-.4a2 2 0 0 1-1.8-1.2L4.5 14A6 6 0 0 1 10 5h4a6 6 0 0 1 5 2z"/><circle cx="15.5" cy="10" r=".5"/><path d="M2 9.5c0 1.4 1 2.5 2.4 2.5"/></svg>
      Savings
    </button>
    <button data-action="go" data-view="history">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      History
    </button>
    <button data-action="go" data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      Settings
    </button>
  </nav>

  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="backdrop" data-action="close"></div>
    <div class="panel" role="dialog" aria-modal="true">
      <div class="grabber" data-action="close"></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <input type="file" id="chase-file" accept=".csv,text/csv,text/comma-separated-values" hidden>
  <input type="file" id="restore-file" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
